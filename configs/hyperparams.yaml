project:
  name: "REM_Reproduction"
  seed: 42
  device: "cuda"  # Tự động fallback sang cpu nếu không có cuda

dataset:
  name: "Celegans"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  edges_file: "celegans_genetic_multiplex.edges"
  nodes_file: "celegans_genetic_nodes.txt"
  
  # Cấu hình tạo dữ liệu mô phỏng
  num_samples_train: 200
  seed_set_size: 50
  mc_simulations: 50
  model: "WC"  # Weighted Cascade

model:
  latent_dim: 64
  hidden_dim: 128
  num_experts: 8    # Paper Table 4: 8 experts
  dropout: 0.2
  entropy_coeff: 0.1 # Paper Table 4: Entropy coefficient 0.1

train:
  batch_size: 64
  lr_vae: 0.003     # Paper Table 4: 0.003
  lr_pmoe: 0.001    # Paper Table 4: 0.001
  kl_weight: 0.55   # Paper Table 4: 0.55
  epochs: 10
  exploration_steps: 100

inference:
  steps: 150        # Số bước gradient ascent (Algorithm 2)
  lr_z: 0.2         # Learning rate khởi tạo cho latent vector
  budget_penalty: 0.5 # Ràng buộc mềm ép sum(x_hat) gần k